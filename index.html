<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>son</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #000;
            color: #fff;
            font-family: "Segoe UI Variable", "Segoe UI", sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .message {
            font-size: 48px;
            font-weight: 400;
            letter-spacing: -0.8px;
            text-align: center;

            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="message" id="message"></div>

    <script>
        const roll = Math.random() * 100;

        let message;

        if (roll < 10) {
            message = "son why are you still here";
        } else if (roll < 30) {
            message = "son this is insane stop looking at me";
        } else {
            message = "son why are you looking here";
        }

        document.getElementById("message").textContent = message;
    </script>

</body>
</html>
